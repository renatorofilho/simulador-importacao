version: '3.8'

services:
  # Banco de Dados MySQL
  db:
    image: mysql:8.0-alpine
    container_name: comex-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-comex_db}
      MYSQL_USER: ${DB_USER:-comex_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-comex_pass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./drizzle/migrations:/docker-entrypoint-initdb.d
    networks:
      - comex-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Aplicação Node.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comex-app
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${DB_USER:-comex_user}:${DB_PASSWORD:-comex_pass}@db:3306/${DB_NAME:-comex_db}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL}
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - comex-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # Nginx (Reverse Proxy e Load Balancer)
  nginx:
    image: nginx:alpine
    container_name: comex-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - comex-network
    restart: unless-stopped

volumes:
  db_data:
    driver: local

networks:
  comex-network:
    driver: bridge
